name: Release

# タグ（v0.1.0 など）を push すると、Windows 用の配布物を作って GitHub Releases に載せる。
# 手動実行（Run workflow）では、配布物を作って動作確認するだけで、Releases には載せない。
on:
  push:
    tags: ["v*"]
    # 配布の設定を変えたときは、ブランチでもビルドして確かめる（Releases には載せない）。
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: インストールとテスト
        run: |
          python -m pip install ".[gui,dev]" nuitka
          python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Nuitka でビルド（フォルダ形式。PyInstaller の onefile より誤検知されにくい）
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --enable-plugin=pyside6
          --windows-console-mode=disable
          --windows-icon-from-ico=packaging/blendkeep.ico
          --output-dir=build --output-filename=BlendKeep.exe
          --include-package=blendkeep
          --include-data-files=src/blendkeep/blender/blendkeep_bridge.py=blendkeep/blender/blendkeep_bridge.py
          --company-name=BlendKeep --product-name=BlendKeep
          --file-description="BlendKeep - Blender 履歴バックアップ"
          --file-version=0.1.0.0 --product-version=0.1.0.0
          --nofollow-import-to=pytest,tkinter
          packaging/blendkeep_gui.py
      - name: 動作確認（部品が揃っているか）
        shell: pwsh
        run: |
          Rename-Item build/blendkeep_gui.dist BlendKeep
          $p = Start-Process -FilePath build/BlendKeep/BlendKeep.exe -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "終了コード: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: zip とチェックサム
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "BlendKeep-$($env:GITHUB_REF_NAME)-windows.zip" } else { "BlendKeep-dev-windows.zip" }
          Compress-Archive -Path build/BlendKeep -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
          Get-Content "$name.sha256"
          "ZIP_NAME=$name" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: BlendKeep-windows
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
      - name: GitHub Releases に載せる（タグのときだけ）
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # Web 画面で先に Release を作ってあれば、配布物を足す。無ければ、ここで作る。
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --clobber
          } else {
            $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
            if (Test-Path $notes) {
              gh release create "$env:GITHUB_REF_NAME" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --title "$env:GITHUB_REF_NAME" --notes-file $notes
            } else {
              gh release create "$env:GITHUB_REF_NAME" "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" --title "$env:GITHUB_REF_NAME" --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "release failed" }
        env:
          GH_TOKEN: ${{ github.token }}
